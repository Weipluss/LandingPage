<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Access</title>
    <style>
        :root {
            --primary: #7C3AED;
            --gradient-end: #4F46E5;
            --accent: #F43F5E;
            --dark: #0F172A;
            --card-bg: #1E293B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(79, 70, 229, 0.03) 0%, transparent 70%);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(124, 58, 237, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 80px rgba(124, 58, 237, 0.15);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .premium-badge {
            background: linear-gradient(135deg, var(--primary), var(--gradient-end));
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            position: relative;
            overflow: hidden;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .premium-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(45deg) translateX(-200%); }
            100% { transform: rotate(45deg) translateX(200%); }
        }

        h1 {
            font-size: 2.2rem;
            color: white;
            margin-bottom: 1rem;
            line-height: 1.2;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(124, 58, 237, 0.3);
        }

        .tagline {
            color: #94A3B8;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .features {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #E2E8F0;
            text-align: center;
            justify-content: center;
        }

        .quality-indicator {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-bar {
            height: 4px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 2px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--gradient-end));
            width: 30%;
            animation: loading 2s infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        .timer {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.2);
            color: #E2E8F0;
            padding: 0.8rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .cta-button {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--gradient-end));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transform: rotate(45deg);
            animation: buttonShine 3s infinite;
        }

        @keyframes buttonShine {
            0% { transform: rotate(45deg) translateX(-200%); }
            100% { transform: rotate(45deg) translateX(200%); }
        }

        .video-icon {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="premium-badge">
            ⭐ PREMIUM ACCESS
        </div>
        
        <h1>Premium Video Stream</h1>
        
        <p class="tagline">Unlimited Access to HD Content</p>

        <div class="features">
            <span class="quality-indicator">📺 4K</span>
            •
            <span>No Ads</span>
            •
            <span>Unlimited</span>
        </div>
        
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <div class="timer" id="countdown">
            <span>⏰</span>
            <span>Premium Access: 2:45</span>
        </div>
        
        <button class="cta-button" id="ctaButton">
            START WATCHING NOW
            <span class="video-icon">🎥</span>
        </button>
    </div>

    <script>
        function startCountdown() {
            let timeLeft = 165; // 2:45 in seconds
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownElement.innerHTML = `
                    <span>⏰</span>
                    <span>Premium Access: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}</span>
                `;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownElement.innerHTML = `
                        <span>⏰</span>
                        <span>Access Expired!</span>
                    `;
                }
                
                timeLeft--;
            }, 1000);
        }

        document.getElementById('ctaButton').addEventListener('click', function() {
            window.location.href = 'https://weiplus.live/c79gl2k.php?lp=1';
        });

        startCountdown();
    </script>
</body>

</html>
